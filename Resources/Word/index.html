<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src 'none'">
<script src="jszip.min.js"></script><script src="docx-preview.min.js"></script>
<style>
html,body{margin:0;background:#f1f2f4;color:#242a31}#loading{font:16px/24px system-ui;padding:40px;text-align:center}
.docx-wrapper{background:transparent!important;padding:32px!important}.docx-wrapper>section.docx{height:auto!important;overflow:visible!important;box-shadow:0 2px 12px #0001!important;margin-bottom:32px!important}
p[data-rid]{cursor:pointer}p[data-rid]:hover{outline:1px solid #b1c4dc;outline-offset:4px}p[data-rid]:focus-visible{outline:2px solid #3866a8;outline-offset:4px}
.reader-translation{font-family:system-ui;color:#30445e;font-style:normal;line-height:1.75;white-space:pre-wrap;text-align:start;overflow-wrap:anywhere;margin:12px 0 16px;padding:12px 16px;border:1px solid #e0e7ef;border-radius:8px;background:#f3f6fa;box-sizing:border-box}
.reader-translation.pending,.reader-translation.error{font:14px/20px system-ui;color:#586477}.reader-translation.error{background:#faf6f0;border-color:#ede2d3;color:#805e32}
.reader-translation button{font:inherit;color:#3866a8;cursor:pointer;background:white;border:1px solid #cad5e3;border-radius:4px;margin-left:8px;padding:4px 8px}
.reader-translation button:focus-visible{outline:2px solid #3866a8;outline-offset:2px}
@media(prefers-color-scheme:dark){html,body{background:#1f1f1f;color:#e4e4e4}}
</style></head><body><div id="loading">正在恢复 Word 原文排版…</div><div id="styles"></div><div id="document"></div>
<script>
let nodes=[], visible=new Set(), automatic=false, observer;
const post=payload=>window.webkit.messageHandlers.reader.postMessage(payload);
function toggle(id){post({kind:'toggle',id});}
async function renderWord(base64){
 const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
 await docx.renderAsync(bytes,document.getElementById('document'),document.getElementById('styles'),{ignoreHeight:true,ignoreWidth:false,ignoreFonts:false,breakPages:true,ignoreLastRenderedPageBreak:true,useBase64URL:true,renderAltChunks:false,renderComments:false});
 nodes=Array.from(document.querySelectorAll('#document article p')).filter(p=>p.innerText.trim().length>0);
 nodes.forEach((p,id)=>{
  p.dataset.rid=id;p.tabIndex=0;p.title='点击展开或收起中文';
  p.addEventListener('click',e=>{if(e.target.closest('a')||window.getSelection().toString().length)return;toggle(id)});
  p.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();toggle(id)}});
 });
 observer=new IntersectionObserver(entries=>{for(const e of entries){const id=Number(e.target.dataset.rid);if(e.isIntersecting){visible.add(id);if(automatic&&/[A-Za-z]{3}/.test(e.target.innerText))post({kind:'visible',id})}else visible.delete(id)}},{threshold:0.05});
 nodes.forEach(p=>observer.observe(p));document.getElementById('loading').remove();
 post({kind:'ready',paragraphs:nodes.map(p=>p.innerText.trim()),tables:document.querySelectorAll('#document table').length,images:document.querySelectorAll('#document img').length});
 return {paragraphs:nodes.length,tables:document.querySelectorAll('#document table').length,images:document.querySelectorAll('#document img').length};
}
function updateReader(states,auto){
 for(const s of states){const p=nodes[s.id];if(!p)continue;
  let target=document.getElementById('translation-'+s.id);
  if(!s.expanded){if(target)target.remove();continue}
  if(!target){target=document.createElement('div');target.id='translation-'+s.id;p.after(target)}
  target.className='reader-translation';target.onclick=null;target.setAttribute('role','status');target.setAttribute('lang','zh-CN');
  if(s.translation){target.textContent=s.translation}
  else if(s.paused&&s.activity){target.classList.add('pending');target.textContent='翻译已暂停';const b=document.createElement('button');b.textContent='继续翻译';b.onclick=()=>post({kind:'resume',id:s.id});target.append(b)}
  else if(s.error){target.classList.add('error');target.textContent=s.error;const b=document.createElement('button');b.textContent='重试';b.onclick=()=>post({kind:'retry',id:s.id});target.append(b)}
  else{target.classList.add('pending');target.textContent=s.loading?(s.activity||'等待翻译…'):'已停止，点击此处继续翻译';if(!s.loading||s.activity==='等待翻译…')target.onclick=()=>post({kind:'retry',id:s.id})}
 }
 const was=automatic;automatic=auto;
 if(automatic&&!was)for(const id of visible){if(/[A-Za-z]{3}/.test(nodes[id].innerText))post({kind:'visible',id})}
}
let positionReady=false, positionTimer;
function reportReadingPosition(){
 if(!positionReady||!nodes.length)return;
 const id=nodes.findIndex(p=>p.getBoundingClientRect().bottom>0);
 if(id>=0)post({kind:'position',id});
}
function restoreReadingPosition(id){
 positionReady=false;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(nodes[id])nodes[id].scrollIntoView({block:'start',behavior:'auto'});
  positionReady=true;
 }));
}
window.addEventListener('scroll',()=>{clearTimeout(positionTimer);positionTimer=setTimeout(reportReadingPosition,120)},{passive:true});
function setZoom(value){document.getElementById('document').style.zoom=value;}
</script></body></html>
